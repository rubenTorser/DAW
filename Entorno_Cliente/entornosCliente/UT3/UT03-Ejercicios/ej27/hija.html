    <body>
        <script>
            window.addEventListener("message", function(evento) {
                if (evento.origin === window.location.origin) {
                    alert("Mensaje recibido en la ventana hija: " + evento.data);
                } else {
                    console.warn("Mensaje recibido de un origen no confiable:", evento.origin);
                }
            });
        </script>
        <button onclick="responder()">Responder</button>

    </body>
